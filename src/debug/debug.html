<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YouSub - Batch Debugger</title>
    <link rel="stylesheet" href="debug.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>YouSub Pipeline &amp; Batch Inspector</h1>
        <div class="header-actions">
          <button id="copy-all-btn" class="copy-all-btn">Copy All</button>
          <button id="clear-debug-btn" class="danger-btn">Clear Logs</button>
          <button id="refresh-debug-btn">Refresh</button>
        </div>
      </header>

      <section id="pipeline-inspector" class="pipeline-inspector" aria-live="polite"></section>

      <div id="debug-list" class="debug-list">
        <div class="empty-state">
          No batches recorded yet. Start a translation to see data here.
        </div>
      </div>
    </div>

    <script src="../shared/libs/browser-polyfill.js"></script>
    <script src="debug.js" type="module"></script>
  </body>
</html>
