<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YouSub</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="container">
      <div class="header">
        <img src="../../assets/icons/icon48.png" alt="YouSub" class="logo" />
        <h1>YouSub</h1>
      </div>

      <div class="content">
        <div id="health-status" class="health-indicator hidden" role="status" aria-live="polite">
          <span class="health-dot"></span>
          <div id="health-text" data-i18n="popupHealthChecking">Checking APIs...</div>
        </div>
        <button
          id="popup-setup-wizard-btn"
          class="setup-cta-btn hidden"
          type="button"
          data-i18n="popupQuickSetupCta"
        >
          30s Free API Setup Guide →
        </button>

        <select id="lang-selector" class="lang-selector"></select>
        <select
          id="style-selector"
          class="lang-selector"
          aria-label="Translation Style"
          data-i18n-aria-label="popupStyleAriaLabel"
        ></select>
        <button id="get-sub-btn" class="primary-btn">Translate to ...</button>
        <div class="button-group">
          <button
            id="clear-page-cache-btn"
            class="secondary-btn hidden"
            data-i18n="popupClearCacheBtn"
          >
            Clear Cache
          </button>
          <button id="open-debug-btn" class="secondary-btn" data-i18n="popupDebugBtn">DEBUG</button>
        </div>

        <div id="loading" class="hidden" role="status" aria-live="polite">
          <div class="spinner"></div>
          <p id="loading-text" data-i18n="popupLoadingText">Extracting...</p>
        </div>

        <div class="toggle-row">
          <label class="switch">
            <input type="checkbox" id="dual-mode-toggle" />
            <span class="slider round"></span>
          </label>
          <label for="dual-mode-toggle" class="toggle-label" data-i18n="popupDualSubtitles">
            Dual Subtitles
          </label>
        </div>

        <hr class="divider" />

        <!-- Playback Resume & Quick Bookmarks (Phase 85 / Decision 23) -->
        <section id="resume-section" class="resume-card" aria-label="Playback Resume">
          <div class="resume-header">
            <div class="resume-title-wrap">
              <label class="switch switch-compact">
                <input type="checkbox" id="resume-auto-toggle" checked />
                <span class="slider round"></span>
              </label>
              <label for="resume-auto-toggle" class="resume-title" data-i18n="popupResumeTitle">
                Playback Resume
              </label>
            </div>
            <button
              type="button"
              id="resume-add-bookmark-btn"
              class="resume-mini-btn hidden"
              data-i18n="popupResumeBookmarkBtn"
            >
              + Bookmark
            </button>
          </div>

          <div id="resume-active-panel" class="resume-active-panel hidden">
            <div class="resume-note-row">
              <input
                type="text"
                id="resume-bookmark-note"
                class="resume-note-input"
                maxlength="80"
                placeholder="Bookmark note (optional)..."
                data-i18n-placeholder="popupResumeBookmarkNotePlaceholder"
              />
              <span id="resume-speed-badge" class="resume-sleep-badge hidden">1.0x</span>
            </div>
            <div id="resume-quick-pills" class="resume-pills-row"></div>
            <div id="resume-bookmarks-list" class="resume-bookmarks-list hidden"></div>
            <div id="resume-checkpoints-wrap" class="resume-checkpoints-wrap hidden">
              <div class="resume-sub-label" data-i18n="popupResumeCheckpointsLabel">
                Checkpoints
              </div>
              <div id="resume-checkpoints-list" class="resume-pills-row"></div>
            </div>
            <div id="resume-ab-wrap" class="resume-sleep-wrap">
              <div class="resume-sleep-header">
                <span class="resume-sub-label" data-i18n="popupResumeAbLabel">A–B Loop</span>
                <span id="resume-ab-badge" class="resume-sleep-badge">Off</span>
              </div>
              <div class="resume-pills-row">
                <button
                  type="button"
                  id="resume-ab-set-a-btn"
                  class="resume-pill"
                  data-i18n="popupResumeAbSetA"
                >
                  Set A
                </button>
                <button
                  type="button"
                  id="resume-ab-set-b-btn"
                  class="resume-pill"
                  data-i18n="popupResumeAbSetB"
                >
                  Set B
                </button>
                <button
                  type="button"
                  id="resume-ab-clear-btn"
                  class="resume-pill hidden"
                  data-i18n="popupResumeAbClear"
                >
                  Clear
                </button>
              </div>
            </div>
            <div id="resume-sleep-wrap" class="resume-sleep-wrap">
              <div class="resume-sleep-header">
                <span class="resume-sub-label" data-i18n="popupResumeSleepLabel">Sleep Timer</span>
                <span id="resume-sleep-badge" class="resume-sleep-badge">Off</span>
              </div>
              <div id="resume-sleep-presets" class="resume-pills-row"></div>
              <div class="resume-sleep-custom-row">
                <input
                  type="number"
                  id="resume-sleep-custom-min"
                  class="resume-sleep-input"
                  min="1"
                  max="360"
                  placeholder="Min"
                  data-i18n-placeholder="popupResumeSleepCustomPlaceholder"
                />
                <button
                  type="button"
                  id="resume-sleep-custom-btn"
                  class="resume-mini-btn"
                  data-i18n="popupResumeSleepSet"
                >
                  Set
                </button>
                <button
                  type="button"
                  id="resume-sleep-off-btn"
                  class="resume-pill hidden"
                  data-i18n="popupResumeSleepOff"
                >
                  Off
                </button>
              </div>
            </div>
          </div>

          <div class="resume-recent-wrap">
            <button
              type="button"
              id="resume-recent-toggle"
              class="resume-recent-toggle"
              aria-expanded="false"
            >
              <span data-i18n="popupResumeRecentTitle">Recent Audio / Videos</span>
              <span id="resume-recent-count" class="resume-recent-count">0</span>
            </button>
            <div id="resume-recent-list" class="resume-recent-list hidden"></div>
          </div>
        </section>

        <hr class="divider" />

        <!-- Live Sparrow-style Pipeline Flow Visualizer (Phase 80b) -->
        <div id="pipeline-visualizer" class="pipeline-visualizer hidden" aria-live="polite"></div>

        <!-- Execution Stats Section (New Phase 35.13) -->
        <div id="execution-stats" class="stats-container hidden">
          <div class="stats-header">
            <span id="stats-title-text" class="stats-title" data-i18n="popupStatsLastExecution"
              >Last Execution</span
            >
            <span id="stats-source-badge" class="stats-badge">API</span>
          </div>
          <div class="stats-model-row">
            <span id="stats-model-name">gemini-1.5-flash</span>
          </div>
          <div class="stats-grid">
            <div class="stats-item">
              <span class="stats-label" data-i18n="popupStatsRequests">Requests</span>
              <span id="stats-requests" class="stats-value">--</span>
            </div>
            <div class="stats-item">
              <span class="stats-label" data-i18n="popupStatsDuration">Duration</span>
              <span id="stats-duration" class="stats-value">--</span>
            </div>
            <div class="stats-item">
              <span class="stats-label" data-i18n="popupStatsInput">Input</span>
              <span id="stats-input-tokens" class="stats-value">--</span>
            </div>
            <div class="stats-item">
              <span class="stats-label" data-i18n="popupStatsOutput">Output</span>
              <span id="stats-output-tokens" class="stats-value">--</span>
            </div>
          </div>
        </div>

        <div id="popup-usage-savings" class="popup-savings-line hidden"></div>

        <button id="open-settings-btn" class="secondary-btn" data-i18n="popupSettingsBtn">
          Settings
        </button>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div
      id="confirm-modal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      aria-describedby="modal-message"
    >
      <div class="modal-content">
        <h3 id="modal-title" data-i18n="popupModalConfirm">Confirm</h3>
        <p id="modal-message" data-i18n="popupModalAreYouSure">Are you sure?</p>
        <div class="modal-footer">
          <button id="modal-cancel-btn" class="secondary-btn" data-i18n="popupModalNo">No</button>
          <button id="modal-confirm-btn" class="secondary-btn danger-btn" data-i18n="popupModalYes">
            Yes
          </button>
        </div>
      </div>
    </div>

    <script src="../shared/libs/browser-polyfill.js"></script>
    <script src="popup.js" type="module"></script>
  </body>
</html>
