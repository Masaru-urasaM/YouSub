<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouSub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../../assets/icons/icon48.png" alt="YouSub" class="logo">
      <h1>YouSub</h1>
    </div>
    
    <div class="content">
      <div id="health-status" class="health-indicator hidden">
        <span class="health-dot"></span>
        <span id="health-text">API Healthy</span>
      </div>
      <p id="status-text">Status: Ready</p>
      
      <button id="get-sub-btn" class="primary-btn">Get & Translate Subtitles</button>
      
      <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p id="loading-text">Extracting...</p>
      </div>

      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="dual-mode-toggle">
          <span class="slider round"></span>
        </label>
        <span class="toggle-label">Dual Subtitles</span>
      </div>

      <hr class="divider">
      
      <button id="open-settings-btn" class="secondary-btn">Open Settings</button>
    </div>
  </div>

  <script src="../shared/libs/browser-polyfill.js"></script>
  <script src="popup.js"></script>
</body>
</html>
