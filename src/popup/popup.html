<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouSub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../../assets/icons/icon48.png" alt="YouSub" class="logo">
      <h1>YouSub</h1>
    </div>
    
    <div class="content">
      <p id="status-text">Ready to get subtitles</p>
      
      <div class="controls">
        <label for="target-lang">Translate to:</label>
        <select id="target-lang">
          <option value="vi" selected>Vietnamese</option>
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
        </select>
      </div>

      <button id="get-sub-btn" class="primary-btn">Get & Translate Subtitles</button>
    </div>
    
    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p id="loading-text">Extracting...</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
